# ─────────────────────────────────────────────────────────────
# Joow SaaS — pile complète, isolée (ne touche pas Luscia)
# app (php-fpm) · web (nginx) · postgres · redis · horizon · scheduler
# En prod : le nginx/Caddy de l'hôte route les domaines vers le service `web`.
# ─────────────────────────────────────────────────────────────
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    env_file: .env
    volumes:
      - ./:/var/www/html
      - sites:/var/www/sites          # sites clients publiés (<slug>)
      - storage:/var/www/html/storage/app
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.0" }   # ne peut pas affamer Luscia

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html:ro
    ports:
      - "127.0.0.1:8090:80"           # exposé en local uniquement, derrière le reverse-proxy hôte

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-joow}
      POSTGRES_USER: ${DB_USERNAME:-joow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-joow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 1g }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  horizon:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    env_file: .env
    volumes:
      - ./:/var/www/html
      - sites:/var/www/sites
      - storage:/var/www/html/storage/app
    command: ["php", "artisan", "horizon"]
    deploy:
      resources:
        limits: { memory: 768m, cpus: "1.0" }   # concurrence des jobs IA maîtrisée

  scheduler:
    build: .
    restart: unless-stopped
    depends_on: [app]
    env_file: .env
    volumes:
      - ./:/var/www/html
    command: ["php", "artisan", "schedule:work"]

volumes:
  pgdata:
  redisdata:
  sites:
  storage:
