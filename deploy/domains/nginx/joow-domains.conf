# ─────────────────────────────────────────────────────────────────────────────
# Joow — domaines personnalisés des sites clients (installé dans /etc/nginx/conf.d/)
# Les fichiers inclus (/etc/nginx/joow/*) sont générés par joow-domains.sh.
# Un seul bloc pour tous les domaines : le certificat est choisi par $ssl_server_name
# (nginx ≥ 1.15.9), le dossier du site par la table domaine → slug.
# ─────────────────────────────────────────────────────────────────────────────
map $host $joow_site  { hostnames; default ""; include /etc/nginx/joow/domains.map; }
map $host $joow_https { hostnames; default 0;  include /etc/nginx/joow/https.map; }

server {
    listen 80;
    listen [::]:80;
    include /etc/nginx/joow/names-http.conf;

    # Validation Let's Encrypt (certbot --webroot)
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }

    location / {
        if ($joow_https) { return 301 https://$host$request_uri; }
        root /var/www/sites/$joow_site;
        index index.html;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    include /etc/nginx/joow/names-https.conf;

    ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:joow_ssl:10m;

    # www → apex
    if ($host ~* ^www\.(.+)$) { return 301 https://$1$request_uri; }

    root /var/www/sites/$joow_site;
    index index.html;
    gzip on; gzip_types text/html text/css application/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /favicon.ico { log_not_found off; access_log off; }
    location / { try_files $uri $uri/ =404; }
}
